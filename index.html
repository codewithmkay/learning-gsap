<!DOCTYPE html>

<html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>GSAP SVG Animation</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<main class="container">

    <div class="svg-wrapper">

        <svg
            id="svg-stage"
            viewBox="-1 -1 103 103"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
        >

            <defs>
                <linearGradient
                    id="gradient"
                    x1="0"
                    y1="0"
                    x2="100"
                    y2="100"
                    gradientUnits="userSpaceOnUse"
                >
                    <stop offset="0%" stop-color="#ff8709"/>
                    <stop offset="100%" stop-color="#f7bdf8"/>
                </linearGradient>
            </defs>

            <path
                id="shape"
                d="M50.5 50.5h50v50s-19.2 1.3-37.2-16.7S56 35.4 35.5 15.5C18.5-1 .5.5.5.5v50h50s25.6-.6 38-18 12-32 12-32h-50v100H.5S.2 80.7 11.8 68.2 40 49.7 50.5 50.5Z"
            />

        </svg>

    </div>

    <h1>we are the future</h1>

</main>


<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/DrawSVGPlugin.min.js"></script>

<script src="script.js"></script>

</body> </html>
